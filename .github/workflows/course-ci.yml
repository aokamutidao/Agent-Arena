name: Course DApp checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: bash tooling/install-contract-deps.sh
      - run: forge fmt --check && forge test --gas-report
        working-directory: contracts
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -race ./... && go vet ./...
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run lint && npm run typecheck && npm test && npm run build
        working-directory: frontend
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: bash tooling/install-contract-deps.sh
      - run: forge build
        working-directory: contracts
      - run: npm ci
        working-directory: frontend
      - run: mkdir -p tmp && go build -o tmp/course-server ./cmd/course-server
        working-directory: backend
      - run: node tooling/smoke-course.mjs
